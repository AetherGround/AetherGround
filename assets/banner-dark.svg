<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="AetherGround — Ground segment, as a service" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <radialGradient id="glow" cx="78%" cy="120%" r="80%">
      <stop offset="0" stop-color="#1c2a4a"/>
      <stop offset="1" stop-color="#070b16"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0" stop-color="#e9cf8f"/>
      <stop offset="1" stop-color="#b8924a"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="320" fill="url(#glow)"/>
  <g fill="#ffffff" opacity=".55">
    <circle cx="120" cy="40" r="1"/><circle cx="310" cy="270" r=".8"/><circle cx="520" cy="60" r="1.1"/>
    <circle cx="690" cy="290" r=".7"/><circle cx="760" cy="30" r="1"/><circle cx="1210" cy="50" r=".9"/>
    <circle cx="440" cy="190" r=".6"/><circle cx="60" cy="230" r=".8"/><circle cx="1160" cy="150" r=".7"/>
  </g>
  <!-- Earth limb + orbits -->
  <g transform="translate(1010 470)">
    <circle r="300" fill="#0d1628" stroke="#2a3a5c" stroke-width="1.5"/>
    <ellipse rx="390" ry="130" transform="rotate(-18)" fill="none" stroke="#c9a961" stroke-opacity=".55" stroke-width="1.2"/>
    <ellipse rx="440" ry="200" transform="rotate(-32)" fill="none" stroke="#7d8bb0" stroke-opacity=".35" stroke-width="1" stroke-dasharray="3 6"/>
    <circle cx="-320" cy="-210" r="5" fill="url(#gold)"/>
    <circle cx="-320" cy="-210" r="12" fill="none" stroke="#c9a961" stroke-opacity=".4"/>
  </g>
  <!-- ground station dish link -->
  <path d="M968 182 L 690 150" stroke="#c9a961" stroke-opacity=".35" stroke-width="1" stroke-dasharray="2 5"/>
  <g font-family="Georgia, 'Times New Roman', serif" fill="#f3efe6">
    <text x="72" y="150" font-size="64" letter-spacing="1">Aether<tspan fill="url(#gold)">Ground</tspan></text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#9aa6c2">
    <text x="74" y="196" font-size="17" letter-spacing="4">GROUND SEGMENT, AS A SERVICE</text>
    <text x="74" y="252" font-size="14" letter-spacing="1.5" fill="#6d7a99">Rust · React/TypeScript · PostgreSQL  —  aetherground.space</text>
  </g>
  <rect x="74" y="168" width="56" height="2" fill="url(#gold)"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
